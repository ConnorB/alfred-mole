name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # scripts/release.sh commits the version to src/info.plist before it
      # creates the tag, so the repository and the release always agree.
      - name: Check that the tag matches the workflow version
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import plistlib
          import sys

          tag_version = sys.argv[1]
          with open("src/info.plist", "rb") as source:
              plist_version = plistlib.load(source)["version"]
          if tag_version != plist_version:
              raise SystemExit(
                  f"Tag v{tag_version} does not match version {plist_version} in src/info.plist. "
                  "Create releases with scripts/release.sh."
              )
          PY

      - name: Build workflow
        run: ./scripts/build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.alfredworkflow --generate-notes --verify-tag
